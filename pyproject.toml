[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "security-llm-lab"
version = "0.1.0"
description = "End-to-end pipeline for building a security-focused LLM with SIEM/SOAR integrations."
authors = [{name = "SecurityLLMLab", email = "security@example.com"}]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31.0",
    "pandas>=2.0.0",
    "pyyaml>=6.0",
    "tqdm>=4.65.0",
    "scikit-learn>=1.3.0",
    "transformers>=4.37.0",
    "datasets>=2.14.0",
    "accelerate>=0.25.0",
    "tenacity>=8.2.0",
    "langchain>=0.1.0",
    "langchain-community>=0.0.10",
    "ollama>=0.1.0",
    "prometheus-client>=0.20.0",
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.20.0",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.27.0",
    "elasticsearch>=8.0.0",
    "langchain-openai>=0.0.1",
    "qdrant-client>=1.7.0",
    "sentence-transformers>=2.2.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.1.8",
    "httpx>=0.24.0",
    "pytest-asyncio>=0.21.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["security_llm_lab*", "main"]
